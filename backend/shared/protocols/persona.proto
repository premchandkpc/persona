syntax = "proto3";

package persona;

message User {
  string id = 1;
  string username = 2;
  string email = 3;
  string display_name = 4;
  string avatar_url = 5;
  int64 created_at = 6;
}

message Content {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string body = 4;
  repeated string tags = 5;
  int64 created_at = 6;
  int64 updated_at = 7;
}

message MediaAsset {
  string id = 1;
  string user_id = 2;
  string filename = 3;
  string mime_type = 4;
  int64 size_bytes = 5;
  string url = 6;
  int64 created_at = 7;
}

message SimulationRun {
  string id = 1;
  string user_id = 2;
  string config_json = 3;
  string status = 4;
  int64 created_at = 5;
  int64 completed_at = 6;
}

message AnalyticsEvent {
  string id = 1;
  string event_type = 2;
  string user_id = 3;
  string payload_json = 4;
  int64 timestamp = 5;
}
